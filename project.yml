name: EdenAI
options:
  bundleIdPrefix: com.edenai
settings:
  IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  EdenAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Sorry, I can't hear you!"
        NSSpeechRecognitionUsageDescription: "Eden uses speech recognition to understand your commands."
